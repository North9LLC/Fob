[package]
name = "fob-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "SSH agent daemon for Fob"

[lib]
name = "fob_agent"
path = "src/lib.rs"

[[bin]]
name = "fob-agent"
path = "src/main.rs"

[dependencies]
fob-core = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
# "rsa" feature deliberately omitted: the `rsa` crate carries RUSTSEC-2023-0071
# (Marvin Attack timing side-channel) with no fixed version available upstream.
# RSA key entries can still be stored/viewed in the vault; they just aren't
# loaded into the SSH agent for signing. Use Ed25519 (the default) instead.
ssh-key = { version = "0.6", features = ["ed25519", "p256", "p384", "p521", "std", "encryption"] }
signature = { version = "2", default-features = false }
