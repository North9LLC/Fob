[workspace]
members = [
    "crates/sigil-core",
    "crates/sigil-cli",
    "crates/sigil-agent",
    "crates/sigil-stego",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["NorthUSB Contributors"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Crypto — RustCrypto stack
argon2 = { version = "0.5", features = ["zeroize"] }
chacha20poly1305 = { version = "0.10", features = ["std"] }
aes-gcm = { version = "0.10" }
hkdf = { version = "0.12" }
sha2 = { version = "0.10" }
blake3 = { version = "1" }
hmac = { version = "0.12" }
sha1 = { version = "0.10" }
pbkdf2 = { version = "0.12" }
ml-kem = { version = "0.3.0-rc.2" }

# Secret handling
zeroize = { version = "1.8", features = ["derive"] }
secrecy = { version = "0.10", features = ["serde"] }
subtle = { version = "2" }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_cbor = { version = "0.11" }
uuid = { version = "1", features = ["v4", "serde"] }

# Random
getrandom = { version = "0.2" }
rand = { version = "0.8" }

# Error handling
thiserror = { version = "1" }
anyhow = { version = "1" }

# TUI
ratatui = { version = "0.27" }
crossterm = { version = "0.27" }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Async runtime (for agent)
tokio = { version = "1", features = ["full"] }

# Misc
base32 = { version = "0.4" }
arboard = { version = "3" }
directories = { version = "5" }
sysinfo = { version = "0.30" }

# Internal crates
sigil-core = { path = "crates/sigil-core" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
# Even in dev, use debug-friendly but not completely unoptimized crypto
opt-level = 1
